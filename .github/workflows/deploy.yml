name: Deploy to Amazon ECR

on:
  push:
    # develop 브랜치에 push 시 자동 실행
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test
          echo " [빌드 파일 목록 확인]"
          ls -R build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          echo " [도커 빌드 전 파일 확인]"
          ls -l ./build/libs/*.jar || echo " 파일을 찾을 수 없습니다!"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin 310133718863.dkr.ecr.ap-northeast-2.amazonaws.com
            
            # 2. 기존 컨테이너 정리
            sudo docker stop payment-app || true
            sudo docker rm payment-app || true
            sudo fuser -k 8080/tcp || true
            
            # 3. 최신 이미지 Pull
            sudo docker pull 310133718863.dkr.ecr.ap-northeast-2.amazonaws.com/payment-demo:latest
            
            # 4. 컨테이너 실행 (환경변수 주입)
            sudo docker run -d --name payment-app -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e PORTONE_STORE_ID='${{ secrets.PORTONE_STORE_ID }}' \
              -e PORTONE_CHANNEL_KG='${{ secrets.PORTONE_CHANNEL_KG }}' \
              -e PORTONE_API_SECRET='${{ secrets.PORTONE_API_SECRET }}' \
              -e PORTONE_WEBHOOK_SECRET='${{ secrets.PORTONE_WEBHOOK_SECRET }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              310133718863.dkr.ecr.ap-northeast-2.amazonaws.com/payment-demo:latest