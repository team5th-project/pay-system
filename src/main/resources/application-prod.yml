api:
  base-url: https://ozmagical.store

spring:
  datasource:
    # EC2 서버에 설치된 MySQL 연결 설정
    url: jdbc:mysql://localhost:3306/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: payuser
    password: ${DB_PASSWORD}
    # 비밀번호는 환경변수로 관리
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 나중에 validate로 변경 추천
      # update = 테이블 자동 생성/수정 (없으면 만들고, 있으면 유지)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      # MySQL에서는 H2 초기화 스크립트 실행 안 함
      mode: never

# PortOne Configuration
portone:
  api:
    base-url: https://api.portone.io
    secret: ${PORTONE_API_SECRET}
  store:
    id: ${PORTONE_STORE_ID}
  channel:
    kg-inicis: ${PORTONE_CHANNEL_KG}
    toss: ${PORTONE_CHANNEL_TOSS}
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET}
