<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, scripts, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <title th:replace="${title}">오조의마법사</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- Third-party Scripts -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    
    <!-- Common Scripts -->
    <script th:src="@{/js/cookie-util.js}"></script>
    <script th:src="@{/js/app-config.js}"></script>
    <script th:src="@{/js/api-handler.js}"></script>
    <script th:src="@{/js/api-validator.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/portone-sdk.js}"></script>
    <script th:src="@{/js/auth-check.js}"></script>

    <!-- Page Specific Scripts / PortOne SDK etc. -->
    <th:block th:replace="${scripts}"></th:block>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🐾 오조의마법사</a>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">홈</a></li>
                <li><a href="/pages/shop" class="nav-link">상점</a></li>
                <li><a href="/pages/orders" class="nav-link">주문</a></li>
                <li><a href="/pages/points" class="nav-link">포인트</a></li>
                <li><a href="/pages/plans" class="nav-link">플랜</a></li>
                <li><a href="/pages/subscribe" class="nav-link">구독 신청</a></li>
                <li><a href="/pages/subscriptions" class="nav-link">구독 관리</a></li>
            </ul>
            <div class="navbar-actions">
                <div class="config-badge-container"></div>
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Content Area -->
        <div class="content-area" th:replace="${content}">
            <!-- Page Specific Content -->
        </div>

        <!-- API Panel -->
        <div class="api-panel">
            <div class="panel-section">
                <h3 class="panel-title">📡 현재 엔드포인트</h3>
                <div id="current-endpoint" class="endpoint-badge">아직 요청 없음</div>
            </div>
            <div class="panel-section">
                <h3 class="panel-title">📤 요청</h3>
                <textarea id="request-body" class="api-textarea"></textarea>
            </div>
            <div class="panel-section">
                <h3 class="panel-title">📥 응답</h3>
                <pre id="response-output" class="response-box">요청 대기 중...</pre>
            </div>
        </div>
    </div>

    <!-- Active Navigation Link Setting for Thymeleaf 3.1+ -->
    <!-- Since implicit #request object is suppressed, JS determines active current route -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
