<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, scripts, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <title th:replace="${title}">오조의마법상점</title>

    <!-- Base Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Third-party Scripts -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

    <!-- Common Scripts -->
    <script th:src="@{/js/cookie-util.js}"></script>
    <script th:src="@{/js/app-config.js}"></script>
    <script th:src="@{/js/api-handler.js}"></script>
    <script th:src="@{/js/api-validator.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/portone-sdk.js}"></script>
    <script th:src="@{/js/auth-check.js}"></script>
    <script th:src="@{/js/page-transition.js}"></script>

    <!-- Page Specific Scripts -->
    <th:block th:replace="${scripts}"></th:block>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">🐾 오조의마법상점</a>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">홈</a></li>
                <li><a href="/pages/orders" class="nav-link">주문내역</a></li>
                <li><a href="/pages/plans" class="nav-link">정기구독</a></li>
<!--                <li><a href="/pages/subscriptions" class="nav-link">구독관리</a></li>-->
                <li><a href="/pages/mypage" class="nav-link">마이페이지</a></li>
            </ul>
            <div class="navbar-actions" id="user-navbar-section" style="display: flex; align-items: center; gap: 10px;">
                <span id="nav-user-info" style="font-weight: bold; color: var(--text-primary); font-size: 0.95rem; display: none;"></span>
                <button id="nav-cart-btn" class="btn btn-outline" style="padding: 0.4rem 0.8rem; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-size: 0.85rem;" onclick="toggleCartModal()">
                    🛒 <span id="nav-cart-count" style="background: var(--primary); color: white; border-radius: 50%; padding: 0.1rem 0.4rem; font-size: 0.75rem; font-weight: bold;">0</span>
                </button>
                 <button class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-radius: 20px; display: none;" onclick="handleLogout()" id="nav-logout-btn">로그아웃</button>
            </div>
        </div>
    </nav>

    <div id="page-transition-overlay" aria-hidden="true"></div>

    <div class="main-container page-transition">
        <!-- Content Area ONLY -->
        <div class="content-area" th:replace="${content}">
            <!-- Page Specific Content -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-content">
            <p>🐾 Team 오조의 마법사 : 권지원, 김예은, 박소영, 정민교, 신현민</p>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">© 2026 오조의마법상점. All rights reserved.</p>
        </div>
    </footer>

    <!-- Active Navigation Link & Auth State Setting -->
    <!-- Cart Modal Overlay -->
    <div id="cart-modal" onclick="if(event.target === this) toggleCartModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div class="cart-summary" style="background: var(--bg-primary); padding: 2rem; border-radius: var(--radius-lg); box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; position: relative;">
            <button onclick="toggleCartModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary); line-height: 1;">&times;</button>
            <h3 style="margin-bottom: 1.5rem; font-family: 'Jua', sans-serif; font-size: 1.8rem; color: var(--text-primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; display: inline-block;">🛒 내 장바구니</h3>
            <div id="cart-items" style="min-height: 100px;">
                <p style="color: var(--text-secondary); text-align: center; padding: 2rem 0;">장바구니가 비어 있습니다.</p>
            </div>

            <div class="cart-total" style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; color: var(--primary-dark); border-top: 2px solid var(--border); padding-top: 1rem;">
                <span>총 주문 금액:</span>
                <span id="cart-total">₩0</span>
            </div>

            <!-- Point Usage -->
            <div class="point-usage" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="use-points" style="font-weight: bold; font-family: 'Gowun Dodum', sans-serif; font-size: 1.1rem; color: var(--text-primary);">💎 포인트 사용 (현재 <span id="current-points">0</span>P)</label>
                    <span style="font-size: 0.85rem; color: var(--text-secondary); background: var(--bg-tertiary); padding: 2px 8px; border-radius: 10px;">1000P 단위</span>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: stretch; margin-bottom: 0.5rem;">
                    <input type="number" id="use-points" class="form-input" style="flex: 1; min-width: 0; font-size: 1.1rem; padding: 0.75rem;"
                           placeholder="사용할 포인트를 입력 (1000 단위)" min="0" step="1000" value="0"
                           onchange="validatePoints()" oninput="validatePoints()">
                    <button type="button" id="cart-full-points-btn" class="btn btn-outline" onclick="applyCartFullPointsToZero()"
                            style="white-space: nowrap; padding: 0.75rem 1rem; font-size: 0.95rem; font-family: 'Gowun Dodum', sans-serif;"
                            title="보유 포인트로 총 결제 금액을 0원으로 맞춥니다 (주문 금액이 1000원 단위일 때)">
                        전액 사용
                    </button>
                </div>
                <p id="cart-point-payment-hint" style="display: none; font-size: 0.85rem; color: var(--danger); margin-bottom: 1rem; line-height: 1.4;">
                    최종 결제 금액이 1000원 미만이 되지 않도록 포인트를 조정해 주세요.
                </p>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button class="btn btn-outline" onclick="toggleCartModal()" style="flex: 1; font-size: 1.1rem; padding: 1rem; font-family: 'Gowun Dodum', sans-serif;">
                    닫기
                </button>
                <button type="button" id="cart-checkout-btn" class="btn btn-primary" onclick="createOrder()" style="flex: 2; font-size: 1.15rem; padding: 1rem; font-family: 'Jua', sans-serif;">
                    📦 주문 결제하기
                </button>
            </div>
        </div>
    </div>

    <!-- Global Cart Scripts -->
    <script>
        window.globalCart = JSON.parse(localStorage.getItem('globalCart')) || {};
        window.cartCurrentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateCartSummary();
        });

        async function loadCartUserPoints() {
            try {
                let token = typeof window.getToken === 'function' ? window.getToken() : localStorage.getItem('accessToken');
                if (!token) return;
                const res = await fetch('/api/points/me', {
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const ptRaw = await res.json();
                    let ptData = ptRaw;
                    if (ptRaw.data && ptRaw.data.content) ptData = ptRaw.data.content;
                    else if (ptRaw.data) ptData = ptRaw.data;

                    if (ptData && ptData.currentPoint !== undefined) {
                        window.cartCurrentUser = { points: ptData.currentPoint };
                        const cp = document.getElementById('current-points');
                        if (cp) cp.textContent = ptData.currentPoint.toLocaleString();
                    }
                }
            } catch (e) { console.error('Failed to load points', e); }
            if (typeof validatePoints === 'function') validatePoints();
        }

        window.updateQuantity = function(productId, delta, productRef) {
            let item = window.globalCart[productId];
            let currentQty = item ? item.quantity : 0;
            let qty = currentQty + delta;
            if (qty < 0) qty = 0;

            let stock = productRef ? productRef.stock : (item ? item.stock : 9999);
            if (qty > stock) {
                if (window.showNotification) window.showNotification(`⚠️ 재고가 ${stock}개만 남았습니다`, 'warning');
                else alert(`재고가 ${stock}개만 남았습니다`);
                qty = stock;
            }

            if (qty === 0) {
                delete window.globalCart[productId];
            } else {
                if (item) {
                    item.quantity = qty;
                    if (productRef) item.stock = productRef.stock;
                } else if (productRef) {
                    window.globalCart[productId] = {
                        quantity: qty,
                        price: productRef.price,
                        name: productRef.name,
                        picture: productRef.picture,
                        stock: productRef.stock
                    };
                }
            }

            localStorage.setItem('globalCart', JSON.stringify(window.globalCart));
            updateCartSummary();
            validatePoints();

            // sync with home.html input if on page
            const input = document.getElementById(`qty-${productId}`);
            if (input) input.value = qty;

            if (delta > 0) {
                const cartBtn = document.getElementById('nav-cart-btn');
                if (cartBtn) {
                    cartBtn.classList.remove('cart-bounce');
                    void cartBtn.offsetWidth;
                    cartBtn.classList.add('cart-bounce');
                }
            }
        };

        window.updateCartSummary = function() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalSpan = document.getElementById('cart-total');
            if (!cartItemsDiv || !cartTotalSpan) return;

            let total = 0;
            let html = '';
            let itemCount = 0;
            let totalQty = 0;

            Object.keys(window.globalCart).forEach(productId => {
                const item = window.globalCart[productId];
                if (item.quantity > 0) {
                    const subtotal = item.price * item.quantity;
                    total += subtotal;
                    itemCount++;
                    totalQty += item.quantity;
                    html += `
                        <div class="cart-item" style="padding: 1rem 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <img src="${item.picture || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--border);">
                                <div>
                                    <div style="font-weight: bold; font-size: 1.1rem; color: var(--text-primary);">${item.name}</div>
                                    <div style="font-size: 0.9rem; color: var(--text-secondary);">₩${item.price.toLocaleString()} x ${item.quantity}개 <div style="display:inline-block; margin-left:10px;"><button onclick="updateQuantity('${productId}', -1)" style="cursor:pointer; padding:2px 8px; border-radius:4px; border:1px solid #ccc; background:#fff;">-</button><button onclick="updateQuantity('${productId}', 1)" style="cursor:pointer; padding:2px 8px; border-radius:4px; border:1px solid #ccc; background:#fff; margin-left:4px;">+</button></div></div>
                                </div>
                            </div>
                            <div style="font-weight: bold; font-size: 1.2rem; color: var(--primary-dark);">
                                ₩${subtotal.toLocaleString()}
                            </div>
                        </div>
                    `;
                }
            });

            cartItemsDiv.innerHTML = itemCount > 0
                ? html
                : '<p style="color: var(--text-secondary); text-align: center; padding: 1rem 0;">장바구니가 비어 있습니다.</p>';

            cartTotalSpan.textContent = `₩${total.toLocaleString()}`;

            const navCartCount = document.getElementById('nav-cart-count');
            if (navCartCount) {
                navCartCount.textContent = totalQty;
                navCartCount.style.transition = 'transform 0.2s';
                navCartCount.style.transform = 'scale(1.2)';
                setTimeout(() => navCartCount.style.transform = 'scale(1)', 200);
            }

            if (typeof updateCartCheckoutButtonState === 'function') updateCartCheckoutButtonState();
        };

        /** PG 최소(1,000원) 정책: 잔액이 0원이거나 1,000원 이상일 때만 결제 가능 */
        window.isFinalAmountValidForPayment = function(orderTotal, usedPoints) {
            const finalAmt = orderTotal - usedPoints;
            if (finalAmt === 0) return true;
            if (finalAmt >= 1000) return true;
            return false;
        };

        window.updateCartCheckoutButtonState = function() {
            const btn = document.getElementById('cart-checkout-btn');
            const hint = document.getElementById('cart-point-payment-hint');
            const fullBtn = document.getElementById('cart-full-points-btn');
            if (!btn) return;

            let cartTotal = 0;
            let itemCount = 0;
            Object.values(window.globalCart || {}).forEach(item => {
                if (item.quantity > 0) {
                    cartTotal += item.price * item.quantity;
                    itemCount++;
                }
            });

            const useP = document.getElementById('use-points');
            const used = useP ? (parseInt(useP.value, 10) || 0) : 0;

            const maxPoints = window.cartCurrentUser && window.cartCurrentUser.points !== undefined
                ? window.cartCurrentUser.points
                : 0;
            const canFullToZero = itemCount > 0 && cartTotal > 0
                && cartTotal % 1000 === 0
                && maxPoints >= cartTotal;
            if (fullBtn) {
                fullBtn.disabled = !canFullToZero;
                fullBtn.style.opacity = canFullToZero ? '1' : '0.45';
            }

            if (itemCount === 0 || cartTotal <= 0) {
                btn.disabled = true;
                if (hint) hint.style.display = 'none';
                if (fullBtn) {
                    fullBtn.disabled = true;
                    fullBtn.style.opacity = '0.45';
                }
                return;
            }

            const ok = window.isFinalAmountValidForPayment(cartTotal, used);
            btn.disabled = !ok;
            if (hint) hint.style.display = ok ? 'none' : 'block';
        };

        /** 보유 포인트로 총 결제 금액을 0원으로 맞춤 (주문 금액이 1000원 단위이고 포인트가 충분할 때만) */
        window.applyCartFullPointsToZero = function() {
            const useP = document.getElementById('use-points');
            if (!useP) return;

            let cartTotal = 0;
            Object.values(window.globalCart || {}).forEach(item => {
                cartTotal += item.price * item.quantity;
            });
            const maxPoints = window.cartCurrentUser && window.cartCurrentUser.points !== undefined
                ? window.cartCurrentUser.points
                : 0;

            if (cartTotal <= 0) {
                if (window.showNotification) window.showNotification('장바구니가 비어 있습니다.', 'warning');
                return;
            }
            if (maxPoints < cartTotal) {
                if (window.showNotification) window.showNotification('보유 포인트가 주문 금액보다 적습니다.', 'warning');
                return;
            }
            if (cartTotal % 1000 !== 0) {
                if (window.showNotification) {
                    window.showNotification('주문 금액이 1000원 단위일 때만 포인트로 0원까지 맞출 수 있습니다.', 'warning');
                } else {
                    alert('주문 금액이 1000원 단위일 때만 포인트로 0원까지 맞출 수 있습니다.');
                }
                return;
            }

            useP.value = cartTotal;
            validatePoints();
            if (window.showNotification) {
                window.showNotification('포인트 전액 사용으로 최종 결제 금액을 0원으로 맞췄습니다.', 'success');
            }
        };

        window.validatePoints = function() {
            const useP = document.getElementById('use-points');
            if (!useP) return;

            let val = parseInt(useP.value) || 0;
            let maxPoints = window.cartCurrentUser && window.cartCurrentUser.points !== undefined ? window.cartCurrentUser.points : 0;

            let cartTotal = 0;
            Object.values(window.globalCart).forEach(item => {
                cartTotal += item.price * item.quantity;
            });

            if (val < 0) val = 0;
            if (val > maxPoints) {
                val = Math.floor(maxPoints / 1000) * 1000;
            }
            if (val > cartTotal) {
                val = Math.floor(cartTotal / 1000) * 1000;
            }

            useP.value = Math.floor(val / 1000) * 1000;
            updateCartCheckoutButtonState();
        };

        window.createOrder = async function() {
            const items = [];
            Object.keys(window.globalCart).forEach(productId => {
                const item = window.globalCart[productId];
                if (item.quantity > 0) {
                    items.push({ productId: productId, quantity: item.quantity });
                }
            });

            if (items.length === 0) {
                if (window.showNotification) window.showNotification('⚠️ 장바구니가 비어있습니다.', 'warning');
                else alert('장바구니가 비어있습니다.');
                return;
            }

            const usePointsInput = document.getElementById('use-points');
            const usedPoints = parseInt(usePointsInput.value) || 0;

            let cartTotalForCheck = 0;
            Object.values(window.globalCart).forEach(item => {
                cartTotalForCheck += item.price * item.quantity;
            });
            if (!window.isFinalAmountValidForPayment(cartTotalForCheck, usedPoints)) {
                if (window.showNotification) {
                    window.showNotification('최종 결제 금액은 0원(포인트 전액)이거나 1,000원 이상이어야 합니다.', 'warning');
                } else {
                    alert('최종 결제 금액은 0원(포인트 전액)이거나 1,000원 이상이어야 합니다.');
                }
                return;
            }

            const orderData = { items: items, usedPoint: usedPoints };

            try {
                if (typeof window.makeApiRequest !== 'function') throw new Error('API 클라이언트가 준비되지 않았습니다');
                const raw = await window.makeApiRequest('create-order', { body: orderData });
                let result = raw;
                if (raw && raw.data) {
                     result = raw.data;
                     if(raw.data.content) result = raw.data.content;
                }

                if (result && (result.orderUid || raw.success)) {
                    if (window.showNotification) window.showNotification('주문 생성 완료! 🛒', 'success');

                    window.globalCart = {};
                    localStorage.removeItem('globalCart');
                    updateCartSummary();
                    toggleCartModal();

                    setTimeout(() => {
                        if (typeof window.navigateWithMagicTransition === 'function') {
                            window.navigateWithMagicTransition('/pages/orders');
                        } else {
                            window.location.href = '/pages/orders';
                        }
                    }, 1000);
                } else {
                    throw new Error('주문 생성 실패 응답');
                }
            } catch (error) {
                console.error('Failed to create order:', error);
                if (window.showNotification) window.showNotification('로그인이 필요하거나 주문 생성에 실패했습니다.', 'error');
                else alert('주문 생성 실패');
            }
        };

        window.toggleCartModal = function() {
            const modal = document.getElementById('cart-modal');
            if (modal) {
                if (modal.style.display === 'none') {
                    loadCartUserPoints();
                    modal.style.display = 'flex';
                } else {
                    modal.style.display = 'none';
                }
            } else {
                window.location.href = '/';
            }
        };
    </script>
    <script>
        window.authPromise = (async () => {
            let token = typeof getToken === 'function' ? getToken() : localStorage.getItem('accessToken');
            if (!token) return null;
            try {
                // api-handler가 있으면 makeApiRequest 사용, 아니면 fetch 사용
                if (typeof makeApiRequest === 'function') {
                    const raw = await makeApiRequest('get-current-user');
                    let user = raw;
                    if (raw.data && raw.data.content) user = raw.data.content;
                    else if (raw.data) user = raw.data;
                    return user;
                } else {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
                    });
                    if (!res.ok) return null;
                    const raw = await res.json();
                    let user = raw;
                    if (raw.data && raw.data.content) user = raw.data.content;
                    else if (raw.data) user = raw.data;
                    return user;
                }
            } catch (e) {
                console.error('Shared auth fetch failed', e);
                return null;
            }
        })();

        document.addEventListener('DOMContentLoaded', async () => {
            // Set active navigation menu
            const currentPath = window.location.pathname;
            document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPath || (currentPath === '/' && link.getAttribute('href') === '/')) {
                    if (currentPath !== '/' || link.getAttribute('href') === '/') {
                        link.classList.add('active');
                    }
                }
            });

            // Fetch User for Header
            const navUserInfo = document.getElementById('nav-user-info');
            const navLoginBtn = document.getElementById('nav-login-btn');
            const navLogoutBtn = document.getElementById('nav-logout-btn');

            const user = await window.authPromise;
            if (user) {
                let displayName = user.name || user.email || '고객';
                navUserInfo.innerHTML = `<a href="/pages/mypage" style="color: inherit; text-decoration: none; cursor: pointer;">반갑습니다, ${displayName}님! 🐈</a>`;
                navUserInfo.style.display = 'inline-block';
                navLogoutBtn.style.display = 'inline-block';
            } else if (navLoginBtn) {
                navLoginBtn.style.display = 'inline-block';
            }
        });

        function handleLogout() {
            if (typeof removeToken === 'function') removeToken();
            localStorage.removeItem('accessToken');
            window.location.href = '/pages/login';
        }

        // Global API Loading Event Listeners
        window.addEventListener('api-load-start', function(e) {
            if (e.detail && e.detail.hideGlobalLoader) return;
            const loader = document.getElementById('global-api-loader');
            if (loader) loader.classList.add('active');
        });
        window.addEventListener('api-load-end', function() {
            const loader = document.getElementById('global-api-loader');
            if (loader) loader.classList.remove('active');
        });
    </script>
    
    <!-- Global API Loader Overlay -->
    <div id="global-api-loader">
        <div class="magic-spinner">🐈✨</div>
        <div class="magic-loading-text">마법을 부리는 중...</div>
    </div>
</body>
</html>
