<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{}, ~{::.content-area})}">
<head>
    <title>홈 - 고양이 마법상점</title>
</head>
<body>
    <div class="content-area">
        <style>
            .product-grid-3cols {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
                margin-top: 2rem;
            }
            @media (max-width: 1024px) {
                .product-grid-3cols {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 768px) {
                .product-grid-3cols {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">
            🛍️ 고양이 마법상점
        </h1>
        <p style="font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 2rem;">
            오조의 마법사 상점에 오신 것을 환영합니다! 고양이 용품을 쉽게 둘러보고 주문해보세요.
        </p>

        <!-- Product Grid -->
        <div class="product-grid-3cols" id="product-list">
            <!-- Products will be rendered here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 2.5rem;">
            <!-- Page numbers will be rendered here -->
        </div>

        <script>
            let products = [];
            let productsCache = {};
            // globalCart is managed by layout.html
            
            let currentUser = null;
            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 6;
            
            function unwrapCommonResponse(response) {
                if (!response || typeof response !== 'object' || Array.isArray(response)) return response;
                const looksLikeCommonResponse =
                    response.data !== undefined &&
                    (response.success !== undefined || response.status !== undefined) &&
                    'timestamp' in response;
                if (!looksLikeCommonResponse) return response;
                return response.data;
            }

            async function loadCurrentUser() {
                try {
                    const user = await window.authPromise;
                    if (user) {
                        currentUser = user;
                        // availablePoint is String in DTO, ensure it's displayed correctly
                        const pts = document.getElementById('current-points');
                        if (pts) pts.textContent = Number(user.availablePoint || 0).toLocaleString();
                    }
                } catch (error) {
                    console.error('Failed to load user info from shared promise:', error);
                    currentUser = null;
                }
            }

            function renderSkeletonProducts() {
                const productList = document.getElementById('product-list');
                productList.innerHTML = Array(pageSize).fill(0).map(() => `
                    <div class="product-card" style="background: var(--bg-primary); padding: 1.25rem; border-radius: var(--radius-lg); border: 2px solid var(--border); box-shadow: 0 4px 10px var(--shadow); display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                        <div class="skeleton-img skeleton"></div>
                        <div class="skeleton skeleton-text" style="width: 40%;"></div>
                        <div class="skeleton skeleton-text" style="width: 80%; height: 1.5rem; margin-top: 0.5rem;"></div>
                        <div class="skeleton skeleton-text" style="width: 50%; height: 1.5rem; margin-top: 0.5rem; flex-grow: 1;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 40px; margin-top: auto;"></div>
                    </div>
                `).join('');
            }

            async function loadProductsFromApi(page = 1) {
                try {
                    renderSkeletonProducts();
                    
                    // Spring Data JPA는 기본적으로 0-indexed page를 사용하므로 클라이언트의 1-indexed를 변환하여 요청
                    const raw = await makeApiRequest('list-products', {
                        params: { page: page - 1, size: pageSize },
                        hideGlobalLoader: true
                    });
                    
                    const result = unwrapCommonResponse(raw);
                    if (!result) return false;

                    if (result.content && Array.isArray(result.content)) {
                        products = result.content;
                        currentPage = result.page || page;
                        totalPages = result.totalPages || Math.ceil((result.totalElements || products.length) / pageSize);
                        
                        products.forEach(p => productsCache[p.id] = p);
                        renderProducts();
                        renderPagination();
                        return true;
                    } else if (Array.isArray(result)) {
                        products = result;
                        currentPage = 1;
                        totalPages = 1;
                        
                        products.forEach(p => productsCache[p.id] = p);
                        renderProducts();
                        renderPagination();
                        return true;
                    } else {
                        console.error('상품 목록 형식이 올바르지 않습니다.', result);
                        return false;
                    }
                } catch (error) {
                    console.error('API 미구현 혹은 에러:', error);
                    let endpoint = '/api/products';
                    if (window.APP_RUNTIME && window.APP_RUNTIME.config && window.APP_RUNTIME.config.demoApi) {
                        endpoint = window.APP_RUNTIME.config.demoApi.endpoints['list-products']?.url || endpoint;
                    }
                    document.getElementById('product-list').innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                            <h3 style="color: var(--text-secondary); margin-bottom: 1rem;">상품 데이터를 불러올 수 없습니다.</h3>
                            <p style="color: var(--text-secondary);">
                                <strong>GET ${endpoint}</strong> API 구현과 서버 상태를 확인해주세요.
                            </p>
                        </div>
                    `;
                    return false;
                }
            }

            function renderProducts() {
                const productList = document.getElementById('product-list');

                if (!products || products.length === 0) {
                    productList.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                            <h3 style="color: var(--text-secondary);">표시할 상품이 없습니다.</h3>
                        </div>
                    `;
                    return;
                }

                productList.innerHTML = products.map((product, index) => {
                    const stockStatus = product.stock > 0
                        ? `<span style="color: var(--success); font-weight: 600;">재고: ${product.stock}개</span>`
                        : `<span style="color: var(--danger); font-weight: 600;">품절</span>`;
                    
                    const defaultPic = 'https://via.placeholder.com/400x300?text=No+Image';
                    const picUrl = product.picture || defaultPic;
                    const currentQty = window.globalCart && window.globalCart[product.id] ? window.globalCart[product.id].quantity : 0;
                    const delay = index * 0.1; // Staggered delay for magic entrance

                    return `
                        <div class="product-card magic-item" style="animation-delay: ${delay}s; background: var(--bg-primary); padding: 1.25rem; border-radius: var(--radius-lg); border: 2px solid var(--border); box-shadow: 0 4px 10px var(--shadow); transition: all 0.2s; display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                            <div class="product-image" style="background: #fff; height: 180px; padding: 0; margin: -1.25rem -1.25rem 1rem -1.25rem; border-bottom: 1px solid var(--border);">
                                <img src="${picUrl}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: contain; border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
                            </div>
                            <div style="font-size: 0.85rem; color: var(--primary); font-weight: bold; margin-bottom: 0.25rem;">
                                ${product.category || '기타'}
                            </div>
                            <div class="card-header" style="font-size: 1.25rem; margin-bottom: 0.5rem; line-height: 1.3; font-family: 'Gowun Dodum', sans-serif; font-weight: bold;">
                                ${product.name}
                            </div>
                            <div class="price" style="font-size: 1.5rem; font-weight: bold; color: var(--primary-dark); margin: 0.5rem 0; flex-grow: 1;">
                                ₩${product.price.toLocaleString()}
                            </div>
                            <div style="margin: 0.5rem 0; font-size: 0.95rem;">
                                ${stockStatus}
                            </div>
                            <div class="quantity-control" style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);">
                                <button class="quantity-btn" onclick="updateQuantityLocal('${product.id}', -1)" ${product.stock === 0 ? 'disabled' : ''} style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; background: var(--bg-tertiary); border: none; cursor: pointer; color: var(--text-primary); transition: background 0.2s;">-</button>
                                <input type="number" class="quantity-input" id="qty-${product.id}" value="${currentQty}" min="0" max="${product.stock}" readonly style="width: 60px; text-align: center; border: none; font-size: 1.1rem; font-weight: bold; background: transparent; color: var(--text-primary);">
                                <button class="quantity-btn" onclick="updateQuantityLocal('${product.id}', 1)" ${product.stock === 0 ? 'disabled' : ''} style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; background: var(--primary); color: #fff; border: none; cursor: pointer; transition: background 0.2s;">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            function renderPagination() {
                const paginationDiv = document.getElementById('pagination');
                if (totalPages <= 1) {
                    paginationDiv.innerHTML = '';
                    return;
                }

                let html = '';
                html += `<button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>이전</button>`;
                
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) {
                    startPage = Math.max(1, endPage - 4);
                }

                for (let i = startPage; i <= endPage; i++) {
                    const isActive = i === currentPage;
                    html += `<button class="btn ${isActive ? 'btn-primary' : 'btn-outline'}" style="padding: 0.5rem 1rem; min-width: 40px;" onclick="changePage(${i})">${i}</button>`;
                }
                
                html += `<button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>다음</button>`;
                
                paginationDiv.innerHTML = html;
            }

            window.changePage = function(page) {
                if (page < 1 || page > totalPages) return;
                loadProductsFromApi(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.updateQuantityLocal = function(productId, delta) {
                const product = productsCache[productId];
                if (!product) return;
                window.updateQuantity(productId, delta, product);
            };

            async function initHomeShop() {
                if (typeof makeApiRequest === 'undefined') {
                    console.log('API functions not loaded yet. Waiting...');
                    return;
                }
                await loadCurrentUser();
                await loadProductsFromApi(1);
            }

            document.addEventListener('DOMContentLoaded', () => {
                if (typeof makeApiRequest !== 'undefined') {
                    initHomeShop();
                } else {
                    window.addEventListener('load', initHomeShop);
                }
            });
        </script>
    </div>
</body>
</html>
